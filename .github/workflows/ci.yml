name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Установка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер (исходники приложения)
        run: python -m flake8 app/

      - name: Линтер (тесты — только настоящие ошибки)
        run: python -m flake8 --select=E9,F63,F7,F82 tests/ benchmark/ run.py

      - name: Тесты
        run: python -m pytest tests/ -q
